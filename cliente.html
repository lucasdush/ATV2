<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Abrir Chamado</title>
<link rel="stylesheet" href="./css/style.css">
<script src="script.js"></script>
</head>
<body>

<header><h1>Abrir Chamado</h1></header>

<nav>
<a href="index.html">Início</a>
<a href="cliente.html">Abrir Chamado</a>
<a href="fila.html">Fila</a>
<a href="lista.html">Lista</a>
</nav>

<div class="container">

<form onsubmit="gerarChamado(event)">

<label>Cliente</label>
<input type="text" id="cliente" required>

<label>E-mail</label>
<input type="email" id="email" required>

<label>Telefone</label>
<input type="text" id="telefone">

<label>Tipo (Título)</label>
<select id="tipo">
<option>Suporte</option>
<option>Infraestrutura</option>
</select>

<label>Problema</label>
<select id="problema" onchange="definirPrioridade()">
<option value="3">Software não inicializa</option>
<option value="2">Função não funciona</option>
<option value="1">Aplicação lenta</option>
</select>

<label>Prioridade</label>
<input type="text" id="prioridade" readonly>

<label>Descrição</label>
<textarea id="descricao" required></textarea>

<button type="submit">Abrir Chamado</button>

</form>

<p id="resultado"></p>

</div>

</body>
</html>
