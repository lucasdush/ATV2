<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Abrir Chamado</title>
</head>

<body>

<h2>Abertura de Chamado</h2>

<form>

<label>CNPJ ou CPF:</label>
<input type="text" name="documento"><br><br>

<label>Tipo de Atendimento:</label>
<select name="tipo">
<option>Suporte</option>
<option>Infraestrutura</option>
</select>

<br><br>

<h3>Suporte</h3>

<input type="radio" name="problema"> Software não inicializa (Grave)<br>
<input type="radio" name="problema"> Função não funciona (Médio)<br>
<input type="radio" name="problema"> Aplicação lenta (Leve)<br>
<input type="radio" name="problema"> Dúvida sobre funcionalidade (Leve)<br>

<br>

<h3>Infraestrutura</h3>

<input type="radio" name="problema"> Implantação<br>
<input type="radio" name="problema"> Adaptação<br>
<input type="radio" name="problema"> Atualização<br>

<br>

<label>Descrição:</label><br>
<textarea rows="5" cols="40"></textarea>

<br><br>

<button type="submit">Abrir Chamado</button>

</form>

<br>
<a href="index.html">Voltar</a>

</body>
</html>
