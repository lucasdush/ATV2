<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Abrir Chamado</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>

<body>

<header>
<h1>Abertura de Chamado</h1>
</header>

<div class="container">

<form>

<label>CNPJ / CPF</label>
<input type="text">

<label>Tipo</label>

<select id="tipo">
<option>Suporte</option>
<option>Infraestrutura</option>
</select>

<label>Problema</label>

<select id="problema" onchange="definirPrioridade()">
<option value="3">Software não inicializa</option>
<option value="2">Função não funciona</option>
<option value="1">Aplicação lenta</option>
<option value="1">Dúvida sobre funcionalidade</option>
</select>

<label>Prioridade</label>
<input type="text" id="prioridade" readonly>

<label>Descrição</label>
<textarea></textarea>

<button onclick="gerarChamado()">Abrir Chamado</button>

</form>

</div>

</body>
</html>
